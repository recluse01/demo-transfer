server:
  port: 8080

spring:
  application:
    name: transfer-service
  datasource:
    url: ${TRANSFER_DB_URL:jdbc:mysql://localhost:3306/transfer?useSSL=false&serverTimezone=UTC&characterEncoding=utf8}
    username: ${TRANSFER_DB_USERNAME:root}
    password: ${TRANSFER_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

account:
  a:
    url: ${ACCOUNT_A_URL:http://localhost:8081}
  b:
    url: ${ACCOUNT_B_URL:http://localhost:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

temporal:
  host-port: ${TEMPORAL_HOST_PORT:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  task-queue: ${TEMPORAL_TASK_QUEUE:transfer-queue}
