# 双平台并存：GitHub 为主仓，GitLab 只读镜像 + 跑测试（Free 版自实现 pull mirror）。
# - mirror 作业：仅定时流水线触发，从公网 GitHub 全量镜像回本 GitLab 仓库。
# - verify 作业：push / MR 触发，跑双轨测试 + JaCoCo 门禁（需带 Docker 的 runner，见方案 A）。
# 防环：mirror 的 push 产生 push 事件，只触发 verify、不会再触发 mirror。
stages:
  - mirror
  - test

# 定时流水线触发：从公网 GitHub 全量镜像回本 GitLab 仓库。
# 需在 Settings → CI/CD → Variables 配 GITLAB_PUSH_TOKEN
#（Project Access Token，角色 Maintainer，勾 write_repository，masked）。
mirror-from-github:
  stage: mirror
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    GIT_STRATEGY: none
    GITHUB_REPO: "https://github.com/recluse01/demo-transfer.git"
  script:
    # shell executor 复用构建目录且 GIT_STRATEGY:none 不清理，先删上次残留保证幂等。
    - rm -rf repo.git
    - git clone --mirror "$GITHUB_REPO" repo.git
    - cd repo.git
    - git push --mirror "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

# push / MR 触发：双轨测试 + JaCoCo 门禁。依赖带 Docker 的 runner（方案 A），未就绪前 pending。
verify:
  stage: test
  rules:
    # tag 触发的流水线一律跳过 verify：保真轨依赖分支上的 runner/Docker 环境，
    # 旧 tag 还可能缺少最新 CI 配置；verify 只在分支与 MR 上跑。
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # docker-java 官方支持通过 $HOME/.docker-java.properties 的 api.version 覆盖远端 API 版本；
    # 这里将 runner 用户的 api.version 固定为 Docker v28 仍接受的 1.44，避免 TC 1.19.8 走到 1.32。
    - |
      DOCKER_JAVA_PROPS="$HOME/.docker-java.properties"
      TMP_PROPS="$DOCKER_JAVA_PROPS.tmp"
      if [ -f "$DOCKER_JAVA_PROPS" ]; then
        grep -v '^api\.version=' "$DOCKER_JAVA_PROPS" > "$TMP_PROPS" || true
      else
        : > "$TMP_PROPS"
      fi
      printf 'api.version=1.44\n' >> "$TMP_PROPS"
      mv "$TMP_PROPS" "$DOCKER_JAVA_PROPS"
      cat "$DOCKER_JAVA_PROPS"
    # shell executor 可能不 source profile；显式推导并导出 JAVA_HOME，避免 Maven 误用其他 JDK。
    - 'export JAVA_HOME="$(java -XshowSettings:properties -version 2>&1 | sed -n ''s/^[[:space:]]*java.home = //p'' | head -n 1)"'
    - 'case "$JAVA_HOME" in */jre) export JAVA_HOME="${JAVA_HOME%/jre}" ;; esac'
    - 'export PATH="$JAVA_HOME/bin:$PATH"'
    - 'java -version'
    - 'mvn -v'
    - mvn -B verify
  artifacts:
    when: always
    paths:
      - "**/target/site/jacoco/"
